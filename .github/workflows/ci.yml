name: source-and-runtime
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check source-only policy
        run: python3 tools/check_source_tree.py
      - name: Python and C++ host tests
        run: bash tools/test.sh

  runtime-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev pkg-config zlib1g-dev
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install python cmake pkg-config ffmpeg
      - name: Build pinned analyzer and recompiler
        run: python3 tools/bootstrap.py --tools-only --jobs 2
      - name: Build and test runtime contracts without commercial inputs
        shell: bash
        run: |
          task_flags=()
          if [[ "$(uname -s)" == Darwin ]]; then
            task_flags+=(-DCMAKE_OSX_ARCHITECTURES=arm64)
          fi
          cmake -S . -B build/runtime -C .deps/fetchcontent.cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DMAFIA_BUILD_RUNTIME=ON -DMAFIA_ENABLE_FFMPEG=ON -DMAFIA_PS2RECOMP_SOURCE_DIR="$PWD/.deps/PS2Recomp" "${task_flags[@]}"
          cmake --build build/runtime --target mafia_runtime_contract_tests mafia_host_tests MafiaHostContract --parallel 2
          ctest --test-dir build/runtime --output-on-failure
      - name: Build and run upstream runtime and IOP regressions
        shell: bash
        run: |
          task_flags=()
          task_cxx_flags="-fno-fast-math -ffp-contract=off"
          if [[ "$(uname -s)" == Darwin ]]; then
            task_flags+=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++)
          else
            task_cxx_flags+=" -msse4.1"
          fi
          cmake -S .deps/PS2Recomp -B build/upstream-tests -C .deps/fetchcontent.cmake \
            -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_CXX_FLAGS=$task_cxx_flags" \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            -DBUILD_TESTING=ON -DPS2X_BUILD_TEST=ON -DPS2X_IOP_BUILD_TESTS=ON \
            -DPS2X_BUILD_RUNTIME=ON -DPS2X_BUILD_RECOMP=ON -DPS2X_BUILD_ANALYZER=ON \
            -DPS2X_BUILD_STUDIO=OFF -DPS2X_ENABLE_DEBUG_UI=OFF -DPS2X_ENABLE_SCCACHE=OFF \
            -DPS2X_ENABLE_FFMPEG=ON -DPS2X_ENABLE_AGRESSIVE_LOGS=OFF "${task_flags[@]}"
          cmake --build build/upstream-tests --parallel 2 --target ps2x_tests \
            ps2_iop_alarm_tests ps2_iop_alarm_state_tests \
            ps2_iop_ioman_file_tests ps2_iop_mailbox_tests ps2_iop_ioman_devctl_tests \
            ps2_iop_cdvd_clock_tests ps2_iop_cdvd_tray_tests ps2_iop_dmacman_tests ps2_iop_modload_policy_tests \
            ps2_iop_cdvd_memory_tests ps2_iop_cdvd_callback_tests ps2_iop_cdvd_search_tests \
            ps2_iop_boot_image_tests ps2_iop_strict_loader_tests \
            ps2_iop_emulator_tests ps2_iop_import_tests ps2_iop_compatibility_tests \
            ps2_iop_import_version_tests ps2_iop_sio2_tests
          # Upstream does not register ps2x_tests with CTest. Its enum-coverage
          # fixture reads instructions.h relative to the upstream source root.
          cmake -E chdir .deps/PS2Recomp "$PWD/build/upstream-tests/ps2xTest/ps2x_tests"
          ctest --test-dir build/upstream-tests/ps2xIOP --output-on-failure --no-tests=error --parallel 2
      - name: Generated integer operations under UBSan
        shell: bash
        run: |
          task_flags=()
          if [[ "$(uname -m)" == arm64 ]]; then
            task_flags+=(--sse2neon .deps/sse2neon)
          fi
          python3 patches/tests/check_integer_codegen.py --source .deps/PS2Recomp --build build/upstream "${task_flags[@]}"
